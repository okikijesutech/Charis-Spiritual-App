# Wazuh Open-Source SIEM & XDR Stack for Charis Cloud Defense Portfolio
# Provides SIEM Log Ingestion, MITRE ATT&CK Mapping, and SOC Dashboard
# Usage: docker compose -f security/siem/docker-compose.yml up -d

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: wazuh-manager
    hostname: wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514/tcp" # Agent connection service
      - "1515:1515/tcp" # Agent enrollment service
      - "514:514/udp"   # Syslog collector (for Vercel log receiver)
      - "55000:55000/tcp" # Wazuh RESTful API
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=admin
    volumes:
      - wazuh_manager_data:/var/ossec/data
      - ./rules/vercel-rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./decoders/vercel-decoders.xml:/var/ossec/etc/decoders/local_decoder.xml:ro
    networks:
      - wazuh-network

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.9.0
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - "plugins.security.ssl.http.enabled=false"
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
    networks:
      - wazuh-network

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - INDEXER_URL=http://wazuh-indexer:9200
      - WAZUH_API_URL=https://wazuh-manager:55000
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    networks:
      - wazuh-network

volumes:
  wazuh_manager_data:
  wazuh_indexer_data:

networks:
  wazuh-network:
    driver: bridge
